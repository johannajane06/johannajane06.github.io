<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>my personal site</title>
  <link rel="stylesheet" href="style.css"> 
  <style type= "text/css">
       body { 
            background-size: cover;          
            background-attachment: fixed;    
            background-position: center;     
            background-repeat: no-repeat;    
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: LightPink; 
         }
         
         .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1;
            top:0;
            left:0;
            background-color: lightcoral;
            overflow-x: hidden;
            transition: 0.5;
            padding-top: 60px;
         }
     

        .sidebar a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color:beige;
            display:block;
            transition: 0.3s;

        }

        .sidebar a:hover {
               color:black;
        }

        .sidebar .closebtn {
            position: absolute;
            top:0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }
        
        .openbtn:hover {
            background-color: lightblue;
        }
        
        #main {
            transition: margin-left .5s;
            padding: 16px
        }

        @media screen and (max-height: 450px) {
            .sidebar {padding-top: 15px;}
            .sidebar a {font-size: 18px;}
        }
        
        #content-box {
            background-color: rgba(255, 255, 255, 0.822); 
            margin: 30px auto;
            width: 70%;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        }

   
    </style>   
    </head>
     <body>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)"
    class="closebtn" onclick="closeNav()">x</a>
        <a href="index.html">HOME</a>
        <a href="background.html">BACKGROUND</a>
        <a href="gallery.html">GALLERY</a>
        <a href="music.html">MUSIC PLAYLIST</a>
        <a href="watched.html">WATCHED</a>
        <a href="more.html">MORE</a>
    </div>
        
    <div id="main">
        <button class="openbtn"
    onclick="openNav()">☰</button>
    </div>

    <script>
    function openNav() {
        document.getElementById("mySidebar").style.
        width ="250px";

        document.getElementById("main").style.marginLeft = "250px";

    }

    function closeNav() {
        document.getElementById("mySidebar").style.width="0";

         document.getElementById("main").style.marginLeft= "0";
    }
    </script>
     
    <div id="content-box">
  <h1 style= 'color: rgb(153,186,221);font-style:italic; font-size: 30px;letter-spacing: 3px;'>ALL ABOUT ME</h1>
  <img src="me.jpg" alt="my profile picture" style="width: 200px; height: auto; border-radius: 50%; border: 3px solid LightCoral; box-shadow: 0 0 15px rgba(240, 128, 128, 0.6);"> 
  <h2 style= 'color: rgb(29, 128, 234);font-style:italic; font-size: 25px;letter-spacing: 2px;'>Welcome to my personal website!</h2>
</div>


    

  
<footer class="site-footer">
    <p style="text-align: center;">2026 My Website. Made with Love</p>
</footer>

</body>
</html>
